---
# =============================================================================
# Sync cert-manager certificates to VPS (HAProxy) and DMZ (Docker/nginx)
# =============================================================================
# Flow: K8s cert-manager secrets → VPS /etc/haproxy/certs/*.pem
#                                → DMZ /srv/certs/*.crt + *.key
#
# Idempotent: Skips sync if checksums match
#
# Credentials sourced from AWX:
#   - K8s API: host, token, CA cert (custom credential)
#   - SSH: Machine credential for VPS/DMZ hosts
# =============================================================================

- name: Fetch certificates from cert-manager
  hosts: localhost
  gather_facts: false
  vars:
    cert_manager_namespace: cert-manager
    temp_dir: "/tmp/cert-distribution-{{ ansible_date_time.epoch }}"
    
  tasks:
    - name: Get current timestamp
      ansible.builtin.setup:
        filter: ansible_date_time

    - name: Create temp directory
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: directory
        mode: '0700'

    - name: Set K8s credentials from environment
      ansible.builtin.set_fact:
        k8s_host: "{{ lookup('env', 'K8S_HOST') }}"
        k8s_token: "{{ lookup('env', 'K8S_TOKEN') }}"
        k8s_ca_cert: "{{ lookup('env', 'K8S_CA_CERT') }}"
      no_log: true

    - name: Write K8s CA cert to temp file
      ansible.builtin.copy:
        content: "{{ k8s_ca_cert }}"
        dest: "{{ temp_dir }}/k8s-ca.crt"
        mode: '0600'
      no_log: true

    - name: Get all TLS secrets in cert-manager namespace
      ansible.builtin.uri:
        url: "{{ k8s_host }}/api/v1/namespaces/{{ cert_manager_namespace }}/secrets"
        method: GET
        headers:
          Authorization: "Bearer {{ k8s_token }}"
        ca_path: "{{ temp_dir }}/k8s-ca.crt"
        validate_certs: true
        return_content: true
      register: all_secrets
      no_log: true

    - name: Filter TLS secrets only
      ansible.builtin.set_fact:
        tls_secrets: "{{ all_secrets.json['items'] | selectattr('type', 'equalto', 'kubernetes.io/tls') | list }}"

    - name: Display discovered certificates
      ansible.builtin.debug:
        msg: "Found {{ tls_secrets | length }} TLS certificates: {{ tls_secrets | map(attribute='metadata.name') | list }}"

    - name: Process each certificate
      ansible.builtin.include_tasks: process_cert.yml
      loop: "{{ tls_secrets }}"
      loop_control:
        loop_var: cert_secret
        label: "{{ cert_secret.metadata.name }}"

    - name: Set certificates fact for other plays
      ansible.builtin.set_fact:
        processed_certs: "{{ tls_secrets | map(attribute='metadata.name') | map('regex_replace', '-tls$', '') | map('regex_replace', '^wildcard-', '') | map('regex_replace', '-', '.') | list }}"
        temp_dir_fact: "{{ temp_dir }}"

# =============================================================================
# VPS (HAProxy) Distribution
# =============================================================================
# become: true - Required to write to /etc/haproxy/certs/ (mode 0700, owned by root)
# delegate_to tasks use become: false - AWX container has no sudo
# =============================================================================
- name: Distribute certificates to VPS (HAProxy)
  hosts: vps_haproxy
  gather_facts: false
  become: true
  ignore_unreachable: true
  vars:
    haproxy_cert_dir: /etc/haproxy/certs
    
  tasks:
    - name: Ensure HAProxy cert directory exists
      ansible.builtin.file:
        path: "{{ haproxy_cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Get list of certificate files
      ansible.builtin.find:
        paths: "{{ hostvars['localhost']['temp_dir_fact'] }}"
        patterns: "*.pem"
      delegate_to: localhost
      become: false
      register: pem_files

    - name: Copy PEM certificates to HAProxy
      ansible.builtin.copy:
        content: "{{ lookup('file', item.path) }}"
        dest: "{{ haproxy_cert_dir }}/{{ item.path | basename }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ pem_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: haproxy_certs_changed
      notify: Reload HAProxy

    - name: Validate HAProxy configuration
      ansible.builtin.command:
        cmd: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
      when: haproxy_certs_changed.changed | default(false)

  post_tasks:
    - name: Record hosts dropped from VPS distribution
      ansible.builtin.set_fact:
        REDACTED_83de4233: >-
          {{
            (hostvars['localhost']['REDACTED_83de4233'] | default([]))
            + (ansible_play_hosts_all | difference(ansible_play_hosts) | list)
          }}
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      ignore_errors: true

  handlers:
    - name: Reload HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: reloaded

# =============================================================================
# DMZ (Docker/nginx) Distribution
# =============================================================================
# become: true - Required to write to /srv/certs/ as root
# delegate_to tasks use become: false - AWX container has no sudo
# Excludes k8s-ca.crt from distribution
# =============================================================================
- name: Distribute certificates to DMZ (Docker/nginx)
  hosts: dmz_docker:dmz_docker_notrf
  gather_facts: false
  become: true
  ignore_unreachable: true
  vars:
    dmz_cert_dir: /srv/certs
    # --- NATS (meshsat-hub) cert volume reconciliation -----------------------
    # See sync_nats_cert_volume.yml. meshsat-nats keeps its TLS material in a
    # Docker NAMED VOLUME, so it is invisible to the "/srv/certs in Mounts"
    # filter used by the restart task below and was never refreshed at all.
    nats_container: meshsat-nats
    nats_cert_dir_in_container: /etc/nats/certs
    nats_cert_file: server.crt
    nats_key_file: server.key
    nats_cert_domain: meshsat.net
    nats_tls_port: 9443
    nats_probe_sni: mqtt-hub.meshsat.net
    # NATS publishes 9443 on 0.0.0.0 via docker-proxy, but 127.0.0.1:9443 does
    # NOT answer on these hosts (verified 2026-08-04 on nldmz01) - probe the
    # address AWX reaches the host on, which does.
    nats_probe_host: "{{ ansible_host | default(inventory_hostname) }}"

  tasks:
    - name: Ensure DMZ cert directory exists
      ansible.builtin.file:
        path: "{{ dmz_cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Get list of certificate files
      ansible.builtin.find:
        paths: "{{ hostvars['localhost']['temp_dir_fact'] }}"
        patterns: "*.crt"
        excludes: "k8s-ca.crt"
      delegate_to: localhost
      become: false
      register: crt_files

    - name: Get list of key files
      ansible.builtin.find:
        paths: "{{ hostvars['localhost']['temp_dir_fact'] }}"
        patterns: "*.key"
      delegate_to: localhost
      become: false
      register: key_files

    - name: Copy certificates to DMZ
      ansible.builtin.copy:
        content: "{{ lookup('file', item.path) }}"
        dest: "{{ dmz_cert_dir }}/{{ item.path | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ crt_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: dmz_certs_changed

    - name: Copy keys to DMZ
      ansible.builtin.copy:
        content: "{{ lookup('file', item.path) }}"
        dest: "{{ dmz_cert_dir }}/{{ item.path | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ key_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: dmz_keys_changed

    - name: Find running Docker containers using certs
      ansible.builtin.shell: |
        docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | while read container; do
          if docker inspect "$container" --format '{{ '{{' }}json .Mounts{{ '}}' }}' | grep -q '/srv/certs'; then
            echo "$container"
          fi
        done
      register: containers_using_certs
      changed_when: false

    - name: Restart containers using certificates
      ansible.builtin.command:
        cmd: "docker restart {{ item }}"
      loop: "{{ containers_using_certs.stdout_lines | default([]) }}"
      when:
        - containers_using_certs is succeeded
        - dmz_certs_changed is changed or dmz_keys_changed is changed

    # Runs unconditionally, NOT gated on dmz_certs_changed: the volume can be
    # stale while /srv/certs is already current - which is exactly the state
    # that hid an expired cert for 51 days. The task file compares fingerprints
    # itself and no-ops when they match.
    - name: Reconcile TLS material held in Docker named volumes (meshsat-nats)
      ansible.builtin.include_tasks: sync_nats_cert_volume.yml

  post_tasks:
    - name: Record hosts dropped from DMZ distribution
      ansible.builtin.set_fact:
        REDACTED_83de4233: >-
          {{
            (hostvars['localhost']['REDACTED_83de4233'] | default([]))
            + (ansible_play_hosts_all | difference(ansible_play_hosts) | list)
          }}
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      ignore_errors: true

- name: Cleanup and report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Cleanup temp directory
      ansible.builtin.file:
        path: "{{ temp_dir_fact }}"
        state: absent

    - name: Normalise unreachable-host list
      ansible.builtin.set_fact:
        REDACTED_83de4233: "{{ REDACTED_83de4233 | default([]) | unique | list }}"

    - name: Banner - all edge hosts reachable
      ansible.builtin.debug:
        msg: "=== Edge cert distribution: 0 hosts skipped as unreachable ==="
      when: REDACTED_83de4233 | length == 0
      ignore_errors: true

    - name: Banner - unreachable hosts skipped
      ansible.builtin.debug:
        msg: "=== WARNING: {{ REDACTED_83de4233 | length }} host(s) skipped as unreachable: {{ REDACTED_83de4233 | join(', ') }} ==="
      when: REDACTED_83de4233 | length > 0
      ignore_errors: true

    - name: Publish unreachable-host stats
      ansible.builtin.set_stats:
        data:
          REDACTED_83de4233: "{{ REDACTED_83de4233 }}"
          unreachable_edge_host_count: "{{ REDACTED_83de4233 | length }}"
      ignore_errors: true

    - name: Final status
      ansible.builtin.debug:
        msg: >-
          Certificate distribution complete.
          Processed {{ processed_certs | length }} certificates: {{ processed_certs | join(', ') }}
