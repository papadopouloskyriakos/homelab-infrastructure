# ===========================================================================
# CI RUNNER IMAGE BUILD PIPELINE
# Builds and pushes runner images to the private registry
# ===========================================================================
# Triggers: Manual, on changes to images/**/* on main
# Registry: registry.example.net/infrastructure/nl/production/
# ===========================================================================

variables:
  IMAGE_REGISTRY: "registry.example.net/infrastructure/nl/production"

.image_build_base:
  stage: .pre
  # docker:28 bumped from :24 on 2026-05-16. Runner host docker engine is
  # 29.x which requires API ≥1.44; docker:24's client speaks API 1.43
  # → `docker login` fails with "client version too old" inside the build
  # container. docker:28 client speaks 1.46+ and works with docker 29.
  # Same fix as daemon/.gitlab-ci.yml's docker stage (already on :28).
  image: docker:28
  services:
    - docker:28-dind
  tags:
    - docker
  before_script:
    # --password-stdin avoids the deprecation warning and is safer
    # (password not in process args).
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  environment:
    name: docker-registry
  allow_failure: true

# ===========================================================================
# CISCO EXECUTION ENVIRONMENT
# ===========================================================================

build_cisco_ee:
  extends: .image_build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - images/cisco-ee/**/*
      when: on_success
  script:
    - |
      cd images/cisco-ee
      docker build -t $IMAGE_REGISTRY/cisco-ee:latest .
      docker push $IMAGE_REGISTRY/cisco-ee:latest

