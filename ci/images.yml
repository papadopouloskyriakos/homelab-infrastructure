# ===========================================================================
# CUBEOS NGINX BASE
# ===========================================================================
# Consumed by the cubeos + meshsat site repos as their FROM. Covers 8 containers
# across both DMZ hosts (cubeos-website, meshsat-website, meshsat-docs, meshsat-releases).
# Migrated into Git 2026-07-29 — was untracked on nlgitlab01 (see CLAUDE.md).
# --pull is REQUIRED: without it a cached cgr.dev/chainguard/nginx layer means the
# rebuild ships the SAME nginx, which is how these sat on 1.29.5 while the base was fixed.

