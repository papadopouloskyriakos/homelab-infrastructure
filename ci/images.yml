# ===========================================================================
# RUST RUNNER (omoikane-daemon + future Rust services)
# ===========================================================================
# Rust 1.94.0 + protoc/openssl/pkg-config preinstalled. Saves ~30-60s per CI
# run vs apt-installing every time on a bare rust:* image.

build_rust_runner:
  extends: .image_build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - images/rust-runner/**/*
      when: manual
  script:
    - |
      cd images/rust-runner
      docker build -t $IMAGE_REGISTRY/rust-runner:1.0 -t $IMAGE_REGISTRY/rust-runner:latest .
      docker push $IMAGE_REGISTRY/rust-runner:1.0
      docker push $IMAGE_REGISTRY/rust-runner:latest

# ===========================================================================
# OMOIKANE-DAEMON RUNNER (project-specific runner with prebuilt deps)
# ===========================================================================
# Builds FROM rust-runner:1.0, then compiles all of omoikane-daemon's 200+
# Cargo.lock dependencies in release mode. Daemon CI's validate + docker
# stages then `cargo build` against the prebuilt deps — only user-source
# compile happens, ~30-60s instead of 5-7 min per stage.
#
# Maintenance: re-sync images/omoikane-daemon-runner/manifests/{Cargo.toml,
# Cargo.lock,rust-toolchain.toml} from daemon/app/ when deps change. Bump
# the :1.0 tag below + the RUST_IMAGE pin in daemon/.gitlab-ci.yml in
# lockstep.

build_omoikane_daemon_runner:
  extends: .image_build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - images/omoikane-daemon-runner/**/*
      when: manual
  script:
    - |
      cd images/omoikane-daemon-runner
      docker build -t $IMAGE_REGISTRY/omoikane-daemon-runner:1.1 -t $IMAGE_REGISTRY/omoikane-daemon-runner:latest .
      docker push $IMAGE_REGISTRY/omoikane-daemon-runner:1.1
      docker push $IMAGE_REGISTRY/omoikane-daemon-runner:latest

# ===========================================================================
# CI DEPLOY TOOLS — alpine + curl + jq + bash for AWX-deploy + utility jobs
# ===========================================================================
# Used by daemon/.gitlab-ci.yml's deploy job (and any other AWX-deploy job)
# to skip the noisy `apk add curl jq` install (~5-10s + log spam) on every
# pipeline. Pre-baked image is ~8MB, layer-cached on the runner.
#
# Bump :1.0 → :1.1 when curl/jq/bash major versions need to change. The
# `--no-progress` install flag suppresses per-package output that operator
# flagged as wasteful triage noise on 2026-05-16.
build_ci_deploy_tools:
  extends: .image_build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - images/ci-deploy-tools/**/*
      when: manual
  script:
    - |
      cd images/ci-deploy-tools
      docker build -t $IMAGE_REGISTRY/ci-deploy-tools:1.1 -t $IMAGE_REGISTRY/ci-deploy-tools:latest .
      docker push $IMAGE_REGISTRY/ci-deploy-tools:1.1
      docker push $IMAGE_REGISTRY/ci-deploy-tools:latest

# ===========================================================================
# CUBEOS-API-BUILDER-RUNNER — Go module cache + prebuilt stdlib
# ===========================================================================
# Migrated 2026-07-29 from /srv/cubeos-api-builder-runner on nlgitlab01,
# where it was built by hand with a GitLab ROOT ADMIN PAT hardcoded as an ARG
# default. Docker bakes ARG defaults into image history and the published image
# is a PUBLIC ghcr package, so that token was anonymously readable on the
# internet from 2026-01-29. The ARG is now empty by design.
#
# GITLAB_PAT must come from a CI variable scoped to `read_repository` on
# products/cubeos/api only. Until that variable exists this job FAILS ON
# PURPOSE — do not "fix" it by putting a token back in the Dockerfile.
build_cubeos_api_builder_runner:
  extends: .image_build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - images/cubeos-api-builder-runner/**/*
      when: manual
  script:
    - |
      cd images/cubeos-api-builder-runner
      if [ -z "${CUBEOS_API_READ_TOKEN:-}" ]; then
        echo "ERROR: CUBEOS_API_READ_TOKEN is not set."
        echo "Create it as a masked CI variable with read_repository scope on"
        echo "products/cubeos/api. Do NOT hardcode a token in the Dockerfile —"
        echo "ARG defaults are recoverable from public image history."
        exit 1
      fi
      docker build --pull --build-arg GITLAB_PAT="$CUBEOS_API_READ_TOKEN" \
        -t $IMAGE_REGISTRY/cubeos-api-builder-runner:latest .
      docker push $IMAGE_REGISTRY/cubeos-api-builder-runner:latest

