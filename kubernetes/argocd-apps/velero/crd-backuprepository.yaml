# Velero BackupRepository CRD, pinned to the deployed server version (v1.17.1).
#
# OMOIKANE-1520: the server was upgraded to v1.17.1 but the CRDs never were. The
# cluster carried the CRD created 2025-11-25 (controller-gen v0.14.0), which still
# lists `resticIdentifier` as REQUIRED. v1.17 uses kopia and does not set that
# field, so every attempt to create a repository was rejected:
#
#   BackupRepository.velero.io "REDACTED_00313366" is invalid:
#       spec.resticIdentifier: Required value
#
# With no BackupRepository, no PodVolumeBackup can be created, so filesystem
# backup silently captured nothing while backups still reported PartiallyFailed
# and every other signal stayed green. 244 days of nightly backups held zero PVC
# data, including the SeaweedFS filer volumes that back the restic repository.
#
# Tracking the CRD here so a future server bump and its CRDs move together.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: backuprepositories.velero.io
  labels:
    component: velero
    managed-by: argocd
    environment: production
spec:
  group: velero.io
  names:
    kind: BackupRepository
    listKind: BackupRepositoryList
    plural: backuprepositories
    singular: backuprepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.repositoryType
      name: Repository Type
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: BackupRepositorySpec is the specification for a BackupRepository.
            properties:
              backupStorageLocation:
                description: 'BackupStorageLocation is the name of the BackupStorageLocation

                  that should contain this repository.'
                type: string
              maintenanceFrequency:
                description: MaintenanceFrequency is how often maintenance should be run.
                type: string
              repositoryConfig:
                additionalProperties:
                  type: string
                description: RepositoryConfig is for repository-specific configuration fields.
                nullable: true
                type: object
              repositoryType:
                description: RepositoryType indicates the type of the backend repository
                enum:
                - kopia
                - restic
                - ''
                type: string
              resticIdentifier:
                description: 'ResticIdentifier is the full restic-compatible string for identifying

                  this repository. This field is only used when RepositoryType is "restic".'
                type: string
              volumeNamespace:
                description: 'VolumeNamespace is the namespace this backup repository contains

                  pod volume backups for.'
                type: string
            required:
            - backupStorageLocation
            - maintenanceFrequency
            - volumeNamespace
            type: object
          status:
            description: BackupRepositoryStatus is the current status of a BackupRepository.
            properties:
              lastMaintenanceTime:
                description: LastMaintenanceTime is the last time repo maintenance succeeded.
                format: date-time
                nullable: true
                type: string
              message:
                description: Message is a message about the current status of the BackupRepository.
                type: string
              phase:
                description: Phase is the current state of the BackupRepository.
                enum:
                - New
                - Ready
                - NotReady
                type: string
              recentMaintenance:
                description: RecentMaintenance is status of the recent repo maintenance.
                items:
                  properties:
                    completeTimestamp:
                      description: CompleteTimestamp is the completion time of the repo maintenance.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: Message is a message about the current status of the repo maintenance.
                      type: string
                    result:
                      description: Result is the result of the repo maintenance.
                      enum:
                      - Succeeded
                      - Failed
                      type: string
                    startTimestamp:
                      description: StartTimestamp is the start time of the repo maintenance.
                      format: date-time
                      nullable: true
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
