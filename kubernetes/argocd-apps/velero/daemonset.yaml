apiVersion: apps/v1
kind: DaemonSet
metadata:
  # MUST be exactly "node-agent". Velero resolves the host pod path via
  # nodeagent.GetPodVolumeHostPath -> getDaemonSet, which fetches the DaemonSet
  # by the literal constant `daemonSet = "node-agent"` (v1.17.1
  # pkg/nodeagent/node_agent.go:38). Named anything else, every PodVolumeBackup
  # fails with:
  #   error to expose PVB: error to extract pod volume path: error getting host
  #   pod path from node-agent: error getting daemonset node-agent:
  #   daemonsets.apps "node-agent" not found
  #
  # Note this is a SECOND lookup, distinct from isRunningInNode's role=node-agent
  # pod selector. Both must be satisfied: the label gets past pod discovery, the
  # name gets past host-path resolution.
  name: node-agent
  namespace: velero
  labels:
    app.kubernetes.io/name: velero-node-agent
    environment: production
    managed-by: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: velero-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velero-node-agent
        environment: production
        managed-by: argocd
        # REQUIRED, and not decorative. Velero's server locates its node-agent
        # by label, not by DaemonSet name and not by app.kubernetes.io/name.
        #
        # v1.17.1 pkg/nodeagent/node_agent.go:119 (isRunningInNode) builds the
        # selector as:
        #     labels.Parse(fmt.Sprintf("role=%s", nodeAgentRole))   // "role=node-agent"
        # and lists pods with it in the velero namespace, then matches on node.
        #
        # `role` is the one that matters on 1.17. `name` is the older
        # restic-era convention and is kept because the upstream chart still
        # sets it and other code paths/tooling reference it; carrying both is
        # harmless and version-proof.
        #
        # Without it, every backup logged
        #   "daemonset pod not found in running state in node <n>"
        # once per affected node, produced ZERO PodVolumeBackup objects, and
        # finished PartiallyFailed — while `kubectl -n velero get pods` showed
        # 4/4 node-agents Running and the DaemonSet reported fully available.
        # Backups ran nightly for 244 days and captured no PVC data at all,
        # including the SeaweedFS filer volumes that hold the restic
        # repository the rest of the estate backs up into.
        #
        # The `selector` above is intentionally left alone: it is immutable on
        # a DaemonSet, and adding a label to the pod template is sufficient
        # because the existing selector still matches.
        name: node-agent
        role: node-agent
    spec:
      serviceAccountName: velero
      containers:
      - name: node-agent
        image: velero/velero:v1.17.1
        command: ["/velero"]
        args:
        - node-agent
        - server
        env:
        - name: VELERO_NAMESPACE
          value: velero
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VELERO_SCRATCH_DIR
          value: /scratch
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /credentials/cloud
        volumeMounts:
        - name: host-pods
          mountPath: /host_pods
          mountPropagation: HostToContainer
        - name: scratch
          mountPath: /scratch
        - name: cloud-credentials
          mountPath: /credentials
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          privileged: true
          runAsUser: 0
      volumes:
      - name: host-pods
        hostPath:
          path: /var/lib/kubelet/pods
      - name: scratch
        emptyDir: {}
      - name: cloud-credentials
        secret:
          secretName: velero-s3-credentials
