---
# =============================================================================
# Velero Secrets via External Secrets Operator
# =============================================================================
# Replaces secret.yaml - credentials now fetched from OpenBao
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access_key_id }}
          aws_secret_access_key={{ .aws_secret_access_key }}
  data:
    # Since 2026-09-23 the gateway's LOCAL key pair (IFRNLLEI01PRD-2850); the
    # old SeaweedFS pair lives on in velero-s3-credentials-legacy below.
    - secretKey: aws_access_key_id
      remoteRef:
        key: secret/REDACTED_218b2888
        property: access_key
    - secretKey: aws_secret_access_key
      remoteRef:
        key: secret/REDACTED_218b2888
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials-legacy
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials-legacy
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access_key_id }}
          aws_secret_access_key={{ .aws_secret_access_key }}
  data:
    - secretKey: aws_access_key_id
      remoteRef:
        key: secret/k8s/velero/s3-credentials
        property: aws_access_key_id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: secret/k8s/velero/s3-credentials
        property: aws_secret_access_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: repository-password
      remoteRef:
        key: secret/k8s/velero/repo-credentials
        property: repository-password
