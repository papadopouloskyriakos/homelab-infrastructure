---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  schedule: "0 2 * * *"
  template:
    # OMOIKANE-1568 (2026-07-31): 30d → 14d. Velero backups had grown to
    # 683 GB (68% of the 1000 Gi SeaweedFS S3), refilling the disk in
    # <24h after the 500→1000 Gi expansion and re-triggering the
    # low-space read-only deadlock (IFRNLLEI01PRD-2052 class) that took
    # the whole NL S3 write path — and all daemon CI — down. Shorter
    # retention keeps backup growth from wedging the shared backend.
    ttl: 336h
    includedNamespaces:
    - "*"
    # seaweedfs excluded (IFRNLLEI01PRD-2227, 2026-08-01): with
    # defaultVolumesToFsBackup this schedule kopia-copied SeaweedFS's own
    # 2×1000Gi volume PVs INTO SeaweedFS — velero's storage backend — a
    # backup that cannot restore the thing it lives inside. The recursive
    # repo reached 602 GiB (94% of the velero collection) and refilled the
    # disks to 95% within a day of the TTL cut above, recreating the
    # 2052-class write outage as its slot-exhaustion variant. SeaweedFS
    # manifests are OpenTofu-managed; its DATA protection is replication
    # 001 + the GR filer.sync mirror, never velero. Belt-and-braces: the
    # seaweedfs pods also carry backup.velero.io/backup-volumes-excludes
    # podAnnotations (namespaces/seaweedfs/values.yaml.tpl).
    excludedNamespaces:
    - kube-system
    - velero
    - seaweedfs
    includeClusterResources: true
    storageLocation: default
    volumeSnapshotLocations:
    - default
    defaultVolumesToFsBackup: true
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-backup
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  schedule: "0 3 * * 0"
  template:
    # OMOIKANE-1568 (2026-07-31): 90d → 60d — see daily-backup note.
    ttl: 1440h
    includedNamespaces:
    - "*"
    # seaweedfs: see the daily-backup note (IFRNLLEI01PRD-2227).
    excludedNamespaces:
    - kube-system
    - velero
    - seaweedfs
    includeClusterResources: true
    storageLocation: default
    volumeSnapshotLocations:
    - default
    defaultVolumesToFsBackup: true
