---
# Per-site BSL mechanism (canonical-modulo-map): each repo checks in its own
# site's bucket and s3Url below; the per-twin mirror map normalizes both to
# the hub form before the byte-diff. The committed values DIFFER per repo on
# purpose: the two SeaweedFS-bearing sites use their own cluster-local S3,
# while the third site points its BSL at the hub's S3 over the mesh (no local
# object store — backups must leave the failure domain, YT-2052). Do not
# "align" these lines by hand; the mirror map owns the equivalence.
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: hetzner
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  # Since 2026-09-23 (IFRNLLEI01PRD-2850): every new backup goes through the
  # in-cluster crypt gateway to Hetzner Object Storage. Same bucket name as the
  # legacy location, now an encrypted directory inside the Hetzner bucket. The
  # credential is the gateway's LOCAL key pair; no Velero anywhere holds a
  # Hetzner key. checksumAlgorithm is emptied because velero-plugin-for-aws
  # v1.13 sends aws-chunked trailing checksums that S3-compatible servers
  # reject (V0 pre-flight 2026-09-23).
  provider: aws
  default: true
  objectStorage:
    bucket: velero
  credential:
    name: velero-s3-credentials
    key: cloud
  config:
    region: gateway
    s3ForcePathStyle: "true"
    s3Url: http://backup-gateway.backup-gateway.svc.cluster.local:8080
    checksumAlgorithm: ""
# The read-only `default` BSL (the old cluster-local / hub SeaweedFS) was removed on
# 2026-09-25 with the store itself (IFRNLLEI01PRD-2887 wave 2, item 3): nothing
# pre-cut-over is restorable any more; `hetzner` is the only location.
---
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: default
  namespace: velero
  labels:
    environment: production
    managed-by: argocd
spec:
  provider: aws
  config:
    region: seaweedfs
